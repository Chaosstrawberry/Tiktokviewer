<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>TikView</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><div class="logo">T</div><b>TikView</b><button id="feedBtn">Feed</button></header><main id="home"><div class="pill">● TikTok Web Viewer</div><h1>Watch videos.<strong>Stay on the web.</strong></h1><p>Paste the link from <b>Share → Copy link</b> and watch it here.</p><div class="input"><input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="none" placeholder="Paste TikTok link..."><button id="paste">Paste</button></div><button class="primary" id="watch">Watch video</button><button class="secondary" id="doom">Start doomscroll</button><div id="error" class="error hidden"></div><div class="note"><b>How it works</b><br><span>TikView resolves supported TikTok Share links and loads TikTok's official web player.</span></div></main><section id="playerView" class="hidden playerView"><div class="playerTop"><button class="round" id="back">←</button><span>NOW PLAYING</span><button class="round" id="add">+</button></div><div class="frame"><iframe id="player" allow="autoplay;encrypted-media;fullscreen" allowfullscreen title="TikTok video"></iframe></div><div class="actions"><button id="copy">Copy link</button><button id="full">Fullscreen</button></div></section><section id="feedView" class="hidden feedView"><div class="feedTop"><button class="round" id="feedBack">←</button><span>DOOMSCROLL</span><span id="counter">0 / 0</span></div><div id="feed" class="feed"></div></section></div><script src="app.js"></script></body></html>
