<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="TikView — a private, mobile-first TikTok web viewer with a local saved feed.">
  <title>TikView</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="TikView home">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span class="brand-name">TikView</span>
      </a>
      <nav class="topnav" aria-label="Primary navigation">
        <a href="#home" data-nav="home">Home</a>
        <a href="#feed" data-nav="feed">My Feed</a>
      </nav>
    </header>

    <main id="app" aria-live="polite"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <template id="home-template">
    <section class="home-page page-pad">
      <div class="hero-copy">
        <div class="eyebrow"><span class="dot"></span> Private • Local • Simple</div>
        <h1>Watch TikTok<br><span>your way.</span></h1>
        <p class="hero-sub">Paste a TikTok link, open it in a clean web player, and keep your own collection without an account.</p>
      </div>

      <form id="watch-form" class="link-card" novalidate>
        <label for="video-url">TikTok video link</label>
        <div class="input-row">
          <input id="video-url" name="video-url" inputmode="url" type="url" autocomplete="off" spellcheck="false" placeholder="Paste a TikTok link…">
          <button id="paste-btn" class="secondary-btn" type="button">Paste</button>
        </div>
        <button class="primary-btn" type="submit">Watch video <span aria-hidden="true">→</span></button>
        <p id="form-error" class="form-error" hidden></p>
        <p class="microcopy">Full links work best. TikView also tries TikTok’s official oEmbed service for shortened links.</p>
      </form>

      <section class="steps" aria-label="How it works">
        <div class="section-head">
          <span class="eyebrow">HOW IT WORKS</span>
          <span class="muted">3 steps</span>
        </div>
        <div class="steps-grid">
          <article class="step"><span>01</span><div><h3>Share on TikTok</h3><p>Open the video you want to watch.</p></div></article>
          <article class="step"><span>02</span><div><h3>Copy link</h3><p>Copy the video URL from the Share menu.</p></div></article>
          <article class="step"><span>03</span><div><h3>Paste here</h3><p>Open it in TikView’s web player.</p></div></article>
        </div>
      </section>

      <section class="privacy-strip">
        <div><strong>Your feed stays on this device.</strong><span>No login. No database. Saved links use localStorage.</span></div>
        <button id="clear-feed-home" class="ghost-btn" type="button">Clear feed</button>
      </section>
    </section>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
